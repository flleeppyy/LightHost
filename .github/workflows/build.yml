# Adapted from Pamplejuce template
# https://github.com/sudara/pamplejuce/blob/580314ceb0/.github/workflows/cmake_ctest.yml

# Reference Documentation
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Build

on:
  workflow_dispatch: # lets you run a build from the UI
  push:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: LightHost
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CMAKE_BUILD_PARALLEL_LEVEL: 3 # Use up to 3 cpus to build juceaide, etc

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            # Windows uses Ninja and Clang (set up in the steps below)
          
          # --- ДОБАВЛЕНА СБОРКА ДЛЯ LINUX ---
          - name: Linux
            os: ubuntu-latest
            # Linux will use the default GCC/G++ compiler

    steps:
  # --- ШАГ: Установка зависимостей для Linux ---
      - name: Install Linux Dependencies (JUCE/Audio)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # Основные библиотеки для JUCE (Audio, Graphics, etc.)
          sudo apt-get install -y libasound-dev libjack-jackd2-dev libx11-dev libxext-dev libxinerama-dev libxft-dev libxcursor-dev libcurl4-openssl-dev libfreetype6-dev libgtk-3-dev
          
          # ИСПРАВЛЕНИЕ: Используем пакет 4.1-dev вместо 4.0-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev 
          
          # Установка Ninja, если он не установлен по умолчанию
          sudo apt-get install -y ninja-build
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "10.0"
      # --- ШАГ: Настройка Clang (только для Windows) ---
      # Clang часто используется на Windows для кросс-компиляции, но для Linux лучше использовать GCC.
      - name: Set up Clang (Windows only)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-clang@v1

      # --- ШАГ: Настройка Ninja (только для Windows) ---
      - name: Set up Ninja (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ninja

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Environment Variables
        shell: bash
        run: |
          VERSION_REGEX='^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$'
          if [[ $GITHUB_REF =~ $VERSION_REGEX ]]; then
              PROJECT_VERSION="${BASH_REMATCH[1]}"
          else
              PROJECT_VERSION="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "PROJECT_VERSION=${PROJECT_VERSION}" >> $GITHUB_ENV

      - name: CMake Configure
        shell: bash
        # Используем Ninja для всех ОС для единообразия и скорости
        run: cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} .

      - name: CMake Build
        shell: bash
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.name }}
          path: |
            # Windows artifact path
            ${{ env.BUILD_DIR }}\${{ env.PROJECT_NAME }}_artefacts\${{ env.BUILD_TYPE }}\**\*.exe
            # Linux artifact path (исполняемый файл)
            ${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}_artefacts/${{ env.BUILD_TYPE }}/${{ env.PROJECT_NAME }}
            # В зависимости от структуры сборки, исполняемый файл может быть в другом месте, например:
            # ${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}
            
  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v4
        with:
          # Загружаем все артефакты, собранные на предыдущем шаге
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          # Используем глобы для поиска файлов по их имени в папках артефактов
          files: |
            artifacts/${{ env.PROJECT_NAME }}-Windows/*
            artifacts/${{ env.PROJECT_NAME }}-Linux/*
            # Добавьте сюда другие расширения, если они появятся (например, .zip, .dmg)
